<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback · Fleet Merits</title>
<link rel="icon" type="image/png" href="../logo.png?v=2">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#5b8dee">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<style>
:root{--bg:#06060d;--sur:#111120;--sur2:#181828;--bor:rgba(255,255,255,0.06);--bor2:rgba(255,255,255,0.12);--acc:#5b8dee;--tx:#eeeef5;--tx2:#9999b0;--tx3:#5a5a72;--ok:#34d399;--bad:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(91,141,238,0.04)1px,transparent 1px),linear-gradient(90deg,rgba(91,141,238,0.04)1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
.page{position:relative;z-index:1}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--bor);backdrop-filter:blur(20px);background:rgba(6,6,13,0.88)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-logo-img{width:34px;height:34px;object-fit:contain}
.nav-name{font-family:'Syne',sans-serif;font-weight:800;font-size:16px}
.nav-name span{color:var(--acc)}
.nb{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--bor);background:transparent;color:var(--tx2);transition:all .2s}
.nb:hover{border-color:var(--acc);color:var(--acc)}
.main{max-width:460px;margin:0 auto;padding:56px 20px}
.pt{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:4px}
.ps{color:var(--tx2);font-size:13px;margin-bottom:28px}
.fc{background:var(--sur);border:1px solid var(--bor2);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
input,textarea{width:100%;background:var(--sur2);border:1px solid var(--bor);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--tx);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
textarea{resize:vertical;min-height:110px}
.sb{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,var(--acc),#7c5cfc);color:#fff;transition:opacity .2s}
.sb:hover:not(:disabled){opacity:.85}
.sb:disabled{opacity:.4;cursor:not-allowed}
.success{text-align:center;padding:28px;display:none}
.success h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--ok);margin-bottom:6px}
.success p{color:var(--tx2);font-size:13px}
</style>
</head>
<body>
<div class="page">
<nav>
  <div class="nav-brand">
    <img src="../logo.png?v=2" class="nav-logo-img" onerror="this.style.display='none'" alt="HR">
    <div class="nav-name">Fleet <span>Merits</span></div>
  </div>
  <a href="../index.html" class="nb">← Back</a>
</nav>
<div class="main">
  <div class="pt">Send Feedback</div>
  <div class="ps">Report an issue or suggest an improvement to HR.</div>
  <div class="fc" id="fc">
    <div><div class="fl">Your Name</div><input type="text" id="fbName" placeholder="Your name"></div>
    <div><div class="fl">Message</div><textarea id="fbText" placeholder="Your feedback…"></textarea></div>
    <button class="sb" id="fbBtn" onclick="submit()">Send Feedback</button>
  </div>
  <div class="success" id="succ">
    <h3>Sent!</h3>
    <p>Thank you. HR has received your message.</p>
    <a href="../index.html" style="display:inline-block;margin-top:16px;color:var(--acc);text-decoration:none;font-size:13px">← Back to Lookup</a>
  </div>
</div>
</div>
<script>
const db=getDB();
async function submit(){
  const name=document.getElementById('fbName').value.trim();
  const text=document.getElementById('fbText').value.trim();
  if(!name||!text){alert('Fill in both fields.');return;}
  document.getElementById('fbBtn').disabled=true;document.getElementById('fbBtn').textContent='Sending…';
  const {error}=await db.from('reports').insert([{reporter_name:name,comment:text}]);
  if(error){alert('Error: '+error.message);document.getElementById('fbBtn').disabled=false;document.getElementById('fbBtn').textContent='Send Feedback';return;}
  document.getElementById('fc').style.display='none';document.getElementById('succ').style.display='block';
}
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script>
</body>
</html>
